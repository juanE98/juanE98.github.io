<div class="container">
  <div class="hero-content">
    <div class="text-content">
      <div class="name-badge">Juan Espares</div>
      <h1 class="greeting">Hi, I'm Juan</h1>
      <div class="typing-container">
        <span class="typed-text">{{ currentText }}</span>
        <span class="cursor">|</span>
      </div>
    </div>
    
    <div class="profile-image">
      <img src="assets/homeJuan.jpg" alt="Juan Espares" class="profile-photo">
    </div>
  </div>
  
  <button class="arrow-button" (click)="scrollToTechnologies()">
    <i class="bi bi-arrow-down-circle"></i>
  </button>
</div>
